name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  checks:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  e2e:
    name: Playwright (smoke funnel)
    runs-on: ubuntu-latest
    needs: checks
    env:
      WORDPRESS_API_URL: ${{ secrets.WORDPRESS_API_URL }}
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:8000
      REVALIDATE_SECRET: ci-dummy-secret-not-used-in-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build (production)
        run: npm run build

      - name: Run smoke tests
        env:
          PLAYWRIGHT_USE_BUILD: "1"
        run: npx playwright test smoke-funnel

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: checks
    env:
      WORDPRESS_API_URL: ${{ secrets.WORDPRESS_API_URL }}
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:8000
      REVALIDATE_SECRET: ci-dummy-secret-not-used-in-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          npm run start &
          sleep 8

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ".lighthouserc.json"
          uploadArtifacts: true
          temporaryPublicStorage: true
