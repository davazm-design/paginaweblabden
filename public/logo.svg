<svg width="200" height="56" viewBox="0 0 200 56" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Background Gradient: Deep Royal Blue to Lighter Blue -->
        <linearGradient id="bgGrad" x1="28" y1="0" x2="28" y2="56" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0284C7"/>
            <stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>
        
        <!-- Circuit Glow -->
        <filter id="circuitGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.5" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>

    <!-- ICON CONTAINER (56x56) -->
    <g>
        <!-- Rounded Background -->
        <rect width="56" height="56" rx="14" fill="url(#bgGrad)"/>
        
        <!-- Left Tooth (Solid White) -->
        <!-- Smooth curve representing the left root and crown -->
        <path d="M28 10C22 10 16 14 16 22C16 32 20 38 23 44C24.5 47 26 46 28 46V10Z" fill="white"/>
        
        <!-- Right Tooth (Digital Circuit) -->
        <!-- stylized circuits forming the right silhouette and cloud -->
        <g stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" filter="url(#circuitGlow)">
            <!-- Horizontal main lines defining the shape -->
            <path d="M29 14H36L38 16"/> 
            <path d="M29 18H40"/> 
            <path d="M29 22H37L44 22"/> <!-- Cloud connection line -->
            <path d="M29 26H34L36 30H38"/>
            <path d="M29 30H34"/> 
            <path d="M29 36H32L34 40"/>
            <path d="M29 42H31"/>
            
            <!-- Cloud Outline (connected to circuits) -->
            <path d="M40 22C42.2 22 44 23.8 44 26C44 28.2 42.2 30 40 30H37" fill="none"/>
            <path d="M40 22C40 19.8 38.2 18 36 18C35.5 18 35 18.1 34.6 18.2" fill="none"/>

            <!-- Circuit Nodes (Dots) -->
            <circle cx="36" cy="14" r="1.5" fill="#38BDF8" stroke="none"/>
            <circle cx="40" cy="18" r="1.5" fill="#38BDF8" stroke="none"/>
            <circle cx="34" cy="26" r="1.5" fill="#38BDF8" stroke="none"/>
            <circle cx="34" cy="40" r="1.5" fill="#38BDF8" stroke="none"/>
            <circle cx="38" cy="30" r="1.5" fill="#38BDF8" stroke="none"/>
        </g>
    </g>

    <!-- LOGOTYPE: "LABDEN" -->
    <!-- Positioned to the right of the icon -->
    <g transform="translate(70 17)" fill="currentColor">
        <!-- L -->
        <path d="M0 0H5V17H14V22H0V0Z"/>
        <!-- A -->
        <path d="M22.5 0H27.5L34 22H28.5L27 16H23L21.5 22H16L22.5 0ZM24 6L24.2 7L26 13H24L24 6Z"/> 
        <!-- B -->
        <path d="M38 0H45C49 0 51 2 51 6C51 8.5 49.5 10 47.5 10.8C50 11.5 51.5 13.5 51.5 16.5C51.5 20.5 48.5 22 44.5 22H38V0ZM43 4V9H45C46.5 9 47 8 47 6.5C47 5 46.5 4 45 4H43ZM43 13V18H45.5C47 18 47.5 17 47.5 15.5C47.5 14 47 13 45.5 13H43Z"/>
        <!-- D -->
        <path d="M57 0H63C68 0 71 4 71 11C71 18 68 22 63 22H57V0ZM62 4V18H63C65 18 66 16 66 11C66 6 65 4 63 4H62Z"/>
        <!-- E -->
        <path d="M77 0H89V4H82V9H88V13H82V18H89V22H77V0Z"/>
        <!-- N -->
        <path d="M95 0H100L107 12V0H112V22H107L100 10V22H95V0Z"/>
    </g>
</svg>
